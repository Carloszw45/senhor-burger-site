<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Senhor Burger</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0e15;color:#f3f4f6;font-family:system-ui,sans-serif}
    #loading{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
  </style>
</head>
<body>
  <div id="loading">Carregando Senhor Burger...</div>
  <script>
    (async () => {
      try {
        const names = Array.from({length:8},(_,i)=>`stitch_source/part${String(i+1).padStart(2,'0')}.b64`);
        const parts = await Promise.all(names.map(async n => {
          const r = await fetch(n, {cache:'no-store'});
          if (!r.ok) throw new Error(`${n}: ${r.status}`);
          return (await r.text()).trim();
        }));
        const bytes = Uint8Array.from(atob(parts.join('')), c => c.charCodeAt(0));
        const html = new TextDecoder('utf-8').decode(bytes);
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        console.error(e);
        document.body.innerHTML = '<main style="min-height:100vh;display:grid;place-items:center;padding:32px;text-align:center">Falha ao carregar o site. Atualize a página.</main>';
      }
    })();
  </script>
</body>
</html>
