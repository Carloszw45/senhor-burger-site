name: Diagnose production assets

on:
  push:
    branches:
      - stitch-final-2026-09-24
    paths:
      - '.github/workflows/repair-all-production-assets.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: stitch-final-2026-09-24

      - name: Validate every WebP independently
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib

          failures = []
          for p in sorted(Path('assets/images/senhor-burger').glob('*.webp')):
              sig = p.read_bytes()[:12]
              digest = hashlib.sha256(p.read_bytes()).hexdigest()[:12]
              try:
                  with Image.open(p) as im:
                      size = im.size
                      fmt = im.format
                      im.verify()
                  print(f'PASS {p.name}: {fmt} {size} {p.stat().st_size} bytes sha={digest} sig={sig!r}')
              except Exception as exc:
                  failures.append((p.name, repr(exc)))
                  print(f'FAIL {p.name}: {p.stat().st_size} bytes sha={digest} sig={sig!r} error={exc!r}')

          if failures:
              print('INVALID_ASSETS=' + repr(failures))
              raise SystemExit(1)
          PY
