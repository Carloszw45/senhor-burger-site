name: Repair production image assets

on:
  push:
    branches:
      - stitch-final-2026-09-24
    paths:
      - '.github/workflows/repair-production-assets.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout final branch
        uses: actions/checkout@v4
        with:
          ref: stitch-final-2026-09-24

      - name: Restore and validate Fat Family and CTA assets
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import re
          import urllib.request

          old_url = 'https://raw.githubusercontent.com/Carloszw45/senhor-burger-site/6d4615804ba3cbfef22f1394b67c1f5004b35707/index.html'
          with urllib.request.urlopen(old_url, timeout=30) as r:
              html = r.read().decode('utf-8')

          tags = re.findall(r'<img\b[^>]*?/?>', html, flags=re.I)

          def external_src_for(kind):
              for tag in tags:
                  lower = tag.lower()
                  if kind == 'fat-family':
                      match = 'product-fat-family' in lower or 'fat family senhor burger' in lower
                  elif kind == 'cta-final':
                      match = 'burger artesanal pronto para pedir' in lower
                  else:
                      match = False
                  if not match:
                      continue
                  m = re.search(r'\ssrc="(https?://[^"]+)"', tag, flags=re.I)
                  if m:
                      return m.group(1)
              raise RuntimeError(f'External source not found for {kind}')

          jobs = {
              'fat-family': Path('assets/images/senhor-burger/fat-family.webp'),
              'cta-final': Path('assets/images/senhor-burger/cta-final.webp'),
          }

          for kind, output in jobs.items():
              url = external_src_for(kind)
              req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  data = r.read()
              img = Image.open(BytesIO(data)).convert('RGB')
              img.thumbnail((720, 900), Image.Resampling.LANCZOS)
              output.parent.mkdir(parents=True, exist_ok=True)
              img.save(output, 'WEBP', quality=78, method=6)
              check = Image.open(output)
              check.verify()
              check = Image.open(output)
              assert check.format == 'WEBP', (kind, check.format)
              assert check.width >= 400 and check.height >= 500, (kind, check.size)
              signature = output.read_bytes()[:12]
              assert signature[:4] == b'RIFF' and signature[8:12] == b'WEBP', (kind, signature)
              print(f'{kind}: WEBP {check.size} {output.stat().st_size} bytes')
          PY

      - name: Commit repaired assets
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/senhor-burger/fat-family.webp assets/images/senhor-burger/cta-final.webp
          git commit -m 'Repair corrupted production image assets'
          git push origin HEAD:stitch-final-2026-09-24
