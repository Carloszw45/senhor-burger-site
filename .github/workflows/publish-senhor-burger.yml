name: Publish final Senhor Burger site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-senhor-burger.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build final static package
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import urllib.request, gzip, base64, re

          html_gz_b64 = ''
          Path('index.html').write_bytes(gzip.decompress(base64.b64decode(html_gz_b64)))

          assets = [
            ('logo-senhor-burger.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuAIBVqRmTUrXVq-6uMciFCHa9JXN3IhbmwpjKQ-7KETcWe_yuk666p3g4i3zuiSW5hUWrQ8ocm6rLiq64ZAIAxnO1W9LNpfHwy7wV2dLIaUnfo0VDSfAtmkitVIkcJOdpROhBnN5g5P7uLMo9Rph2H4bhhhnRRL7pKvxl_B4j0fWswn28umnH08VDNKUb-cQv1GmQEROxo-dkFl2-9Aq0F-SW99cWxKT-0OH3IEuP8WRMeknLtSOPLkI_OGTCcEhRJo-LU',512,84),
            ('hero-main.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuCEPwKm7xjeAbs_aoNJIzrUxQZE7cPjkdSChEjWeF3oIJULShB65vkAMA0cYcULNLVqTU3mW2Uon_7sTuohgNuy0hkJt7HGIZfI1FuwveFNDHU08o68M1LvWZ1qLnwX5M58JwYcTIQxw4x9a46D2kXaZupg6U5z-cERxIs-cI5Y-98NKU3bJjW3HX5DhvbszrJ_DJ78H-INXsst63z-635d_5dhXq--PpbpuQ6Bud9mJpuivDK0MaIEPqGtC_UU4oPH-_k',900,82),
            ('fat-family.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuDJHr4Ed5CJSRvR6P7nkHZyI5cCTy7O4Ce-NdvsrFelbj5aQwauvfZKgA26GYQSVcESKCqjk_WZYc753KZkfdbhOKdfB70UCo7-V4c7uMgeBYhABnI_H4sGcaMgNpavCfhwbH7oKRgEYeOQqpsjTu76IdtxSKGuQV9wk60UtaFDr2OuT6uMM-fG1P-7xw1j9YXD3-FCyRdC052KdWzxFGluUzTcZLta8aoJ_0gBJc6T50Vfv1RfERgL7tIlMibDCw64xRw',900,82),
            ('big-elvis.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuAiL8ejyHy5-uMDKYIrAjAw1tMwu9Q3TYF7t0AbizI7vwifnRy_e7s_5e0Iwz93eAok8ipVkRMbipAtIBG9Emr5kJQH61RQWiz35UnKd-aJu4vuztjATQzhHg2kXRuhr7nOHK-Bbi3zbCDDvhrnRqaZ4VglQgsPBgk_dNxxcRmR0wEbtCYFcUo6vQJDU9SVGQbyi1DTq50lLj-ZsGmIuSs4yHGzr3w57nL88ZSXAXKjyTDTFZpZQwzB5MHko7tLzCuA144',720,82),
            ('smash-joplin.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuDo-kfp5aQ6oAD5Fketxcanz69CVt0q16KoaLxwTb6tFX0kbK6I9qtr8kTafHqiOCJi231xoXMdcW7JYuz6fwFn6cYLzT1p-9r5Q4jCDxCqzuItmIYFBKp1Ymc7GJVLmS-Rlld_xsWtwUwBlJgiMV0FVF8PgWqOEQt8CMIs-NIe0X9upD7dV6wwCWgvPoQsrMdU4H4jNaG-uadh_wvuCMa2NX0kaqeFWBimGRu2VO-fP0wRZ0sT68ksYYWWMPveIuYVe4s',720,82),
            ('veggie-marley.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuDMe72uSxRLvSsaR4wMtvkKfCUyknvdcrymkpVcsF7bTBg8cs7vZbP_WwA6vf5-90arA4I8_1xXB_zi57xxpNAjhbbNB_I-uxERjgVK8svi-8qZ6n5hOLJz9TaKXrmJ4mxwJ6xdZRyw3fVOO1qzvxucdabsMR2BTgcl0osi3UIDP23q6U2NDb-XH08T4A6PquBLgukS74s44Jpwfi3vy0_6XZgHhKMRYFNdO_E8HA4tZPWgZlfmHtgzqU7VGqaQtLTsvU4',720,82),
            ('a-casa.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuDEA9WEKtPWTeeLcAeBIBjVNcggLwrVFXEAxHzQy09ChfsnQ78ztT4durxBwCO5H-5RY_1aVy-w3gZTV5xoz5CRjoeUsRVCbEDmBgsNTEBiJvUTxsWg08-0rbin2_FtzWG3ZQSnt9y7VExGYBvYEawczinTfCdYUhyu0GX6J03N8M4Avr9fLrzPyMM-FxmibiyDlzt9wSL2nZ5lKuZt1DCtAbslwdxCzSbc1QOueJ-adUAnm6wRZRWFCy_48fgQ-OAUQM0',900,82),
            ('cta-final.webp','https://lh3.googleusercontent.com/aida-public/AB6AXuAB_7zwS6gJ7a-4gVICevKz4x6yM1XVpie_pzJCs6qy99RvvsfO8AhkxfLQS_O-3furvB9ZE2GfYXhg9ZchVS2EYUQ4C1z0WwywjJj2o2PGQI8nntfYKjJwsCuDZ9n-lyukZ_2uskX6NY99FQo7xwFD_xXCewh-vzJCAZVUKVQkL_QNyCeiJyshgOsFB45XvFlgaYDgAmGDaO-fxq1F0Pl7YLQM8-MhgpXHJp8zzRSvv3ldNCroYDeda5O04G-z3oYayyk',720,82),
          ]
          outdir = Path('assets/images/senhor-burger')
          outdir.mkdir(parents=True, exist_ok=True)
          for filename, url, maxw, quality in assets:
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = response.read()
              image = Image.open(BytesIO(data))
              image = image.convert('RGBA' if image.mode in ('RGBA','LA') else 'RGB')
              if image.width > maxw:
                  h = round(image.height * maxw / image.width)
                  image = image.resize((maxw, h), Image.Resampling.LANCZOS)
              target = outdir / filename
              image.save(target, 'WEBP', quality=quality, method=6)
              with Image.open(target) as check:
                  check.verify()
              print(filename, target.stat().st_size)

          html = Path('index.html').read_text(encoding='utf-8')
          if 'lh3.googleusercontent.com' in html:
              raise RuntimeError('Temporary Stitch image URL remains in index.html')
          refs = set(re.findall(r'src="(assets/images/senhor-burger/[^"]+)"', html))
          missing = [ref for ref in refs if not Path(ref).exists()]
          if missing:
              raise RuntimeError(f'Missing local assets: {missing}')
          print('Validated', len(refs), 'local image references')
          PY
      - name: Commit final production package
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/senhor-burger
          git diff --cached --quiet && exit 0
          git commit -m 'Publish final Stitch production site'
          git push origin HEAD:main
