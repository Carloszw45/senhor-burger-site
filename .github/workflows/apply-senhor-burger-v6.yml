name: Apply Senhor Burger mobile header and map fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-senhor-burger-v6.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply approved Stitch corrections
        shell: python
        run: |
          import base64, re
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          header = base64.b64decode("").decode("utf-8")
          location = base64.b64decode("").decode("utf-8")

          html, n1 = re.subn(
              r'<!-- SECTION 01:.*?</header>',
              lambda _: header,
              html,
              count=1,
              flags=re.S,
          )
          html, n2 = re.subn(
              r"<!-- SECTION 06:.*?</section>",
              lambda _: location,
              html,
              count=1,
              flags=re.S,
          )

          if n1 != 1:
              raise SystemExit(f"Header replacement count: {n1}")
          if n2 != 1:
              raise SystemExit(f"Location replacement count: {n2}")
          if "whitespace-nowrap" not in header or "flex-shrink-0" not in header:
              raise SystemExit("Mobile CTA nowrap safeguards missing")
          if "output=embed" not in location or "<iframe" not in location:
              raise SystemExit("Google Maps embed missing")
          if "lh3.googleusercontent.com/aida-public" in html:
              raise SystemExit("Temporary Stitch image URLs reintroduced")

          path.write_text(html, encoding="utf-8")

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix mobile header and embed location map"
          git push
